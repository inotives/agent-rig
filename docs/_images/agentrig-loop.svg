<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">AgentRig local engineering loop</title>
  <desc id="desc">A planner creates a task, a worker implements it, and a reviewer checks it. Review findings return to the worker until the task is complete. Tasks and handoffs remain in the project folder.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#93c5fd"/>
    </marker>
  </defs>

  <rect width="1200" height="520" rx="28" fill="#020617"/>
  <rect x="24" y="24" width="1152" height="472" rx="22" fill="url(#panel)" stroke="#334155" stroke-width="2"/>
  <text x="64" y="72" fill="#f8fafc" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="28" font-weight="700">A local, controllable engineering loop</text>
  <text x="64" y="104" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17">Use your Codex or Claude subscription inside the project folder.</text>

  <rect x="64" y="136" width="1072" height="278" rx="18" fill="#0b1224" stroke="#475569" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="88" y="170" fill="#cbd5e1" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">your-project/</text>
  <text x="88" y="392" fill="#94a3b8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15">.agent-rig/  tasks  handoffs  profiles  skills  workflow.sqlite</text>

  <g filter="url(#shadow)">
    <rect x="104" y="210" width="244" height="116" rx="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/>
    <rect x="478" y="210" width="244" height="116" rx="16" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
    <rect x="852" y="210" width="244" height="116" rx="16" fill="#713f12" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <text x="226" y="250" text-anchor="middle" fill="#dbeafe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700">Planner</text>
  <text x="226" y="278" text-anchor="middle" fill="#bfdbfe" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">plan → task brief</text>
  <text x="600" y="250" text-anchor="middle" fill="#dcfce7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700">Worker</text>
  <text x="600" y="278" text-anchor="middle" fill="#bbf7d0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">implement → handoff</text>
  <text x="974" y="250" text-anchor="middle" fill="#fef3c7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="23" font-weight="700">Reviewer</text>
  <text x="974" y="278" text-anchor="middle" fill="#fde68a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">check → approve or return</text>

  <path d="M348 268H466" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M722 268H840" fill="none" stroke="#93c5fd" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M974 340C974 382 600 382 600 340" fill="none" stroke="#fbbf24" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="786" y="378" text-anchor="middle" fill="#fde68a" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="15">review findings return to the worker</text>

  <text x="600" y="462" text-anchor="middle" fill="#93c5fd" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="16">Repeat until the reviewer accepts the task.</text>
</svg>
